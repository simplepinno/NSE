name: NSE snapshot

on:
  schedule:
    # 07:00-12:00 UTC = 10:00-15:00 EAT, Mon-Fri, on the hour
    - cron: "0 7-12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-snapshot
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "NSE snapshot $(TZ=Africa/Nairobi date +'%F %H:%M')"
            git pull --rebase
            git push
          fi
